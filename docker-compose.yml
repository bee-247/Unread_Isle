name: ${COMPOSE_PROJECT_NAME:-unread_isle}

services:
  frontend:
    build:
      context: ./Unread_Isle_Frontend
      dockerfile: Dockerfile
    image: unread_isle/frontend:local
    container_name: unread_isle-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    networks:
      - unread_isle

  backend:
    build:
      context: ./Unread_Isle_Backend
      dockerfile: Dockerfile
    image: unread_isle/backend:local
    container_name: unread_isle-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      canal:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unread_isle}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-unread_isle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}

      CANAL_ENABLED: ${CANAL_ENABLED:-true}
      CANAL_HOST: canal
      CANAL_PORT: 11111
      CANAL_DESTINATION: ${CANAL_DESTINATION:-example}
      CANAL_USERNAME: ${CANAL_USERNAME:-}
      CANAL_PASSWORD: ${CANAL_PASSWORD:-}
      CANAL_FILTER: ${CANAL_FILTER:-unread_isle.outbox}
      CANAL_BATCH_SIZE: ${CANAL_BATCH_SIZE:-100}
      CANAL_INTERVAL_MS: ${CANAL_INTERVAL_MS:-1000}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-chat}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      ES_VECTOR_INDEX: ${ES_VECTOR_INDEX:-unread_isle_ai_index}

      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_PUBLIC_DOMAIN: ${OSS_PUBLIC_DOMAIN:-}
      OSS_FOLDER: ${OSS_FOLDER:-avatars}

      JWT_ISSUER: ${JWT_ISSUER:-Unread_Isle}
      JWT_KEY_ID: ${JWT_KEY_ID:-unread_isle-local-key}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      JWT_PRIVATE_KEY: file:/run/secrets/jwt/private.pem
      JWT_PUBLIC_KEY: file:/run/secrets/jwt/public.pem
    volumes:
      - ./.secrets/jwt:/run/secrets/jwt:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - unread_isle

  mysql:
    image: mysql:${MYSQL_VERSION:-8.4.8}
    container_name: unread_isle-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unread_isle}
      MYSQL_USER: ${MYSQL_USERNAME:-unread_isle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Unread_Isle_Backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - unread_isle

  redis:
    image: redis:${REDIS_VERSION:-7.4.10-alpine}
    container_name: unread_isle-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - unread_isle

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.9.1}
    container_name: unread_isle-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - unread_isle

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-9.2.1}
    container_name: unread_isle-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 45s
    networks:
      - unread_isle

  canal:
    image: canal/canal-server:${CANAL_VERSION:-v1.1.8}
    platform: ${CANAL_PLATFORM:-linux/amd64}
    container_name: unread_isle-canal
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      canal.auto.scan: "false"
      canal.destinations: ${CANAL_DESTINATION:-example}
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: root
      canal.instance.dbPassword: ${MYSQL_ROOT_PASSWORD}
      canal.instance.connectionCharset: UTF-8
      canal.instance.tsdb.enable: "true"
      canal.instance.gtidon: "false"
      canal.instance.filter.regex: ${CANAL_FILTER_REGEX:-unread_isle\\.outbox}
    ports:
      - "${CANAL_PORT:-11111}:11111"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/11111'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - unread_isle

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  elasticsearch-data:

networks:
  unread_isle:
    name: unread_isle-network
